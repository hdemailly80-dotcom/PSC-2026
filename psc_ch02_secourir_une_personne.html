<script>
const F=[{"ref": "02PR01", "t": "PR", "n": "01", "title": "Hémorragies", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Hémorragie</strong> : perte de sang d’une plaie ou d’un orifice naturel qui ne s’arrête pas spontanément ; imbibe un mouchoir en quelques secondes. Une écorchure qui s’arrête seule n’en est pas une.</li><li><strong>Risques</strong> : victime → détresse circulatoire, arrêt cardiaque ; secouriste → contamination (effraction cutanée, projection sur muqueuses).</li></ul><h3>CAT</h3><ul><li>Constater l’hémorragie (écarter les vêtements).</li><li><mark>arrêter immédiatement l’hémorragie :</mark><ul><li>en demandant à la victime de comprimer immédiatement, ou à défaut le faire à sa place</li></ul></li><li>Maintenir la compression <mark>(par la victime ou le secouriste)</mark> ; allonger confortablement la victime.</li><li><mark>faire alerter ou alerter les secours et appliquer leurs consignes</mark></li><li><mark>mettre en place :</mark><ul><li><mark>un pansement compressif si l’hémorragie est contrôlée manuellement et pour se libérer</mark></li><li><mark>un garrot si la compression d’une hémorragie d’un membre est inefficace ou impossible</mark></li></ul></li></ul><p class=\"note\"><mark>Sans retarder les secours : gants ou sac plastique ; ne rien porter à la bouche, au nez ou aux yeux. Inefficace : le saignement persiste malgré tout. Impossible : nombreuses victimes, catastrophes, violence collective ou guerre, nombreuses lésions, plaie inaccessible, corps étranger.</mark></p><ul><li>Rassurer la victime.</li><li><mark>réchauffer la victime, car l’hypothermie aggrave l’état de la victime</mark></li><li><mark>protéger la victime contre le froid, les intempéries</mark></li><li><mark>surveiller attentivement : l’efficacité des gestes réalisés ; apparition de signes d’aggravation, notamment : sueurs abondantes, sensation de froid, pâleur intense, perte de connaissance</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li></ul><h3>Saignement de nez</h3><ul><li>Asseoir, tête penchée en avant (jamais allongée) ; se moucher vigoureusement ; comprimer les deux narines 10 min sans relâcher. Avis médical si : persiste ou se reproduit, après chute ou coup, médicaments augmentant les saignements.</li></ul><h3>Perte de sang par un orifice naturel (sauf le nez)</h3><ul><li><mark>si la victime vomit ou crache du sang : position où elle se sent le mieux si consciente ; allongée sur le côté, position stable, si elle a perdu connaissance</mark></li><li><mark>dans les autres cas, allonger la victime</mark></li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>faire alerter ou alerter les secours et appliquer les consignes</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li></ul><p class=\"note\"><mark>Vomir ou cracher du sang peut traduire une maladie grave nécessitant une prise en charge médicale.</mark></p><h3>Contact du secouriste avec le sang</h3><ul><li><mark>ne rien porter à la bouche (mains, objets, nourritures), au nez ou aux yeux</mark></li><li><mark>retirer les vêtements souillés dès la fin de l’action de secours</mark></li><li><mark>se laver les mains ou toute zone souillée ; gel hydroalcoolique éventuel</mark></li><li>Avis médical sans délai si plaie même minime souillée ou projection sur le visage.</li></ul>"}, {"ref": "02FT01", "t": "FT", "n": "01", "title": "Compression", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Indication</strong> : toute plaie qui saigne abondamment.</li></ul><h3>Compression manuelle</h3><ul><li>Appuyer fortement sur l’endroit qui saigne ; interposer tôt une épaisseur de tissu propre ; maintenir jusqu’au relais par un pansement compressif.</li></ul><p class=\"note\"><mark>Si le secouriste ne peut maintenir la compression (nombreuses victimes) : demander à la victime ou à un témoin capable d’appuyer, en s’assurant de sa protection. Avec ce qui est efficace et qu’on peut maintenir aisément : mains protégées par des gants ou un sac plastique, voire le genou.</mark></p><h3>Pansement compressif</h3><ul><li><mark>indiqué si : la victime ne peut pas appuyer elle-même ; l’hémorragie est déjà contrôlée par la compression manuelle ; le secouriste doit se libérer (alerter, geste vital) ; et la plaie n’est pas au cou, à la tête, au thorax ou à l’abdomen</mark></li><li><mark>ainsi que face à une amputation ou un arrachement</mark></li><li><mark>réalisation : recouvrir complètement la plaie d’une épaisseur de tissu propre ; fixer avec un lien large (ou bande élastique) assez long ; serrer suffisamment pour maintenir l’arrêt du saignement</mark></li><li><mark>si le saignement se poursuit : reprendre la compression manuelle par-dessus le pansement</mark></li><li><strong>Points clés</strong> : compression suffisante et permanente.</li></ul>"}, {"ref": "02FT02", "t": "FT", "n": "02", "title": "Garrot", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Indication</strong> : hémorragie d’un membre, compression inefficace ou impossible. <mark>Il ne peut être posé qu’aux membres supérieurs ou inférieurs.</mark></li><li><strong>Matériel</strong> : lien de toile solide, non élastique, 3 à 5 cm de large, ≥ 1,50 m ; barre rigide de 10 à 20 cm. Garrot industriel : suivre les instructions du fabricant. Jamais de garrot élastique de prise de sang.</li></ul><h3>Réalisation</h3><ul><li><mark>se munir du matériel nécessaire (garrot industriel préférable si disponible)</mark></li><li><mark>positionner : à quelques centimètres de la plaie (idéalement 5 à 7 cm), entre la plaie et la racine du membre, jamais sur une articulation</mark></li></ul><h3>Improvisé avec barre</h3><ol><li>Deux tours avec le lien à l’endroit du garrot, puis un nœud.</li><li>Placer la barre au-dessus du nœud, faire deux nœuds par-dessus.</li><li>Tourner la barre jusqu’à l’arrêt du saignement.</li><li>Maintenir le serrage : le secouriste (même si douleur intense) ou tout moyen si besoin de se libérer.</li></ol><h3>Improvisé sans barre</h3><ul><li>Lien large seul, plié en deux pour faire une boucle ; glisser la boucle sous le membre ; passer une extrémité dans la boucle ; serrer très fort en tirant sur chaque extrémité ; double nœud.</li></ul><h3>Dans tous les cas</h3><ul><li><mark>vérifier régulièrement l’efficacité du garrot si la victime est totalement recouverte (éviter l’hypothermie)</mark></li><li><mark>noter l’heure de pose (lisiblement, sur le garrot, une fiche…) pour la communiquer au relais</mark></li><li><strong>Points clés</strong> : en amont de la plaie (entre le cœur et la plaie) ; serré pour arrêter le saignement.</li></ul>"}, {"ref": "02PR02", "t": "PR", "n": "02", "title": "Obstruction des voies aériennes (OVA)", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Définition</strong> : gêne ou empêchement brutal des mouvements de l’air entre l’extérieur et les poumons <mark>par un corps étranger.</mark></li><li><strong>Risques</strong> : <mark>si le passage de l’air est menacé ou interrompu, l’arrivée d’oxygène aux poumons peut être réduite ou stoppée, pouvant compromettre rapidement la vie de la victime. Sans intervention rapide : hypoxie, perte de connaissance, puis arrêt cardiaque en quelques minutes.</mark></li><li><strong>Obstruction partielle</strong> : parle, crie <mark>(notamment enfant ou nourrisson)</mark>, tousse, respire (parfois avec un bruit) : <mark>l’obstruction n’est pas totale. Elle peut durer plusieurs minutes après l’accident, car la respiration n’est pas complètement interrompue.</mark></li><li><strong>Obstruction totale</strong> : ne peut plus parler, crier, tousser, bouche ouverte, s’agite, devient bleue : <mark>alors l’obstruction est totale.</mark></li></ul><p><mark>L’action du secouriste doit permettre : de désobstruer les voies aériennes en cas d’obstruction totale ; d’empêcher toute aggravation.</mark></p><h3>CAT</h3><ul><li>Demander à la victime si elle s’étouffe, et de tousser.</li><li><strong>Peut parler, crier, tousser</strong> : continuer de l’encourager à tousser ; surveiller l’efficacité de la toux ou des signes de fatigue.</li><li><strong>Ne peut plus parler, crier, tousser</strong> :<ul><li><mark>laisser la victime dans la position où elle se trouve, généralement debout ou assise</mark></li><li>1 à 5 « claques dans le dos »</li><li>si inefficace ou impossible : 1 à 5 « compressions », abdominales (adulte, enfant) ou thoraciques (nourrisson ; obèse ou femme enceinte si l’abdomen ne peut être encerclé ; personne alitée ou allongée)</li><li>répéter le cycle claques / compressions ; interrompre dès toux <mark>efficace,</mark> cris ou pleurs, reprise de la respiration, rejet du corps étranger</li></ul></li><li><strong>Si elle respire ou après succès</strong> :<ul><li><mark>installer la victime en position d’attente, confortablement et sans délai</mark></li><li>desserrer les vêtements ; faire alerter ou alerter les secours (même si désobstruction efficace)</li><li><mark>protéger contre la chaleur, le froid ou les intempéries</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li></ul></li><li><strong>Si elle perd connaissance</strong> : l’accompagner au sol, réaliser une RCP.</li></ul>"}, {"ref": "02FT03", "t": "FT", "n": "03", "title": "Désobstruction par claques dans le dos", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><mark>indication : OVA par corps étranger chez une victime consciente incapable de parler ou de tousser, ou dont la toux devient inefficace (adulte, adolescent, enfant) ; de pleurer fortement ou reprendre sa respiration (nourrisson, jeune enfant), notamment lorsqu’elle est nourrie, qu’elle mange ou jouait sans surveillance</mark></li><li><strong>But</strong> de <mark>cette technique</mark> : provoquer un mouvement de toux pour expulser le corps étranger.</li></ul><h3>Adulte et grand enfant</h3><ul><li>Se placer sur le côté, légèrement en arrière ; soutenir le thorax d’une main, pencher la victime vers l’avant ; 1 à 5 claques vigoureuses entre <mark>les omoplates</mark>, avec le talon de la main ouverte.</li></ul><h3>Victime pouvant tenir sur la cuisse</h3><ul><li>S’asseoir, basculer la victime sur la cuisse, face vers le bas ; 1 à 5 claques <mark>vigoureuses dans le dos</mark>, entre <mark>les omoplates</mark>, talon de la main ouverte.</li></ul><h3>Victime pouvant tenir sur l’avant-bras (nourrisson, petit enfant)</h3><ul><li>Maintenir la tête (pouce d’un côté, 1-2 doigts de l’autre à l’angle de la mâchoire, sans appuyer sur la gorge) ; à califourchon sur l’avant-bras, face au sol, tête plus basse que le thorax ; 1 à 5 claques vigoureuses entre <mark>les omoplates</mark>.</li><li><strong>Points clés</strong> : entre <mark>les omoplates</mark>, talon de la main ouverte, de façon vigoureuse.</li></ul>"}, {"ref": "02FT04", "t": "FT", "n": "04", "title": "Désobstruction par compressions abdominales", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Indication</strong> : obstruction <mark>totale</mark> chez un adulte ou un enfant après 5 claques inefficaces, si le secouriste peut se tenir debout ou à genoux derrière.</li><li><strong>But</strong> : comprimer l’air des poumons, effet « piston » ; plusieurs pressions parfois nécessaires.</li></ul><h3>Réalisation (adulte, enfant)</h3><ul><li>Pencher la victime en avant ; se placer debout (à genoux pour un enfant) derrière elle, contre son dos ; bras sous ceux de la victime ; poing fermé (dos de la main vers le ciel) juste au-dessus du nombril, seconde main dessus ; tirer franchement vers l’arrière et vers le haut, <mark>sans appuyer les avant-bras sur les côtes</mark> ; 1 à 5 compressions, en relâchant entre chacune.</li><li><strong>Points clés</strong> : au creux de l’estomac ; sans appuyer sur les côtes ; vers l’arrière et le haut.</li></ul>"}, {"ref": "02FT05", "t": "FT", "n": "05", "title": "Désobstruction par compressions thoraciques", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><mark>indication : obstruction totale lorsqu’il est impossible d’encercler l’abdomen (personne obèse ; femme enceinte ; personne alitée ou allongée, difficilement mobilisable) ; chez une victime qui peut tenir sur l’avant-bras du secouriste</mark></li></ul><h3>Personne dont on ne peut encercler l’abdomen</h3><ul><li>Derrière la victime, avant-bras sous ses bras, encercler la poitrine ; poing fermé <mark>au centre de la poitrine, sur la moitié inférieure du sternum,</mark> sans appuyer sur la pointe du sternum ; autre main dessus, sans appuyer les avant-bras sur les côtes ; tirer franchement vers l’arrière ; 1 à 5 compressions <mark>successives,</mark> en relâchant <mark>complètement</mark> entre chacune.</li><li>Personne alitée ou allongée : compressions thoraciques comme pour un arrêt cardiaque.</li></ul><h3>Nourrisson (sur l’avant-bras)</h3><ul><li>Avant-bras contre le dos, main soutenant la tête ; retourner le nourrisson face au ciel.</li><li><mark>poser le nourrisson de telle sorte que : son dos et sa tête reposent directement sur les deux cuisses du secouriste ; sa tête soit plus basse que le reste du corps</mark></li><li><mark>comme pour les compressions d’un arrêt cardiaque : entourer le thorax avec les mains</mark></li><li><mark>placer deux pouces, l’un sur l’autre, au centre de la poitrine, sur la moitié inférieure du sternum</mark></li><li><mark>effectuer de 1 à 5 compressions successives, en relâchant complètement entre chacune. La profondeur de compression est au-delà d’un tiers de la hauteur du thorax.</mark></li><li><strong>Points clés</strong> : <mark>au centre de la poitrine, sur la moitié inférieure du sternum</mark> ; sans appuyer sur les côtes ; vers l’arrière ; profondes chez le nourrisson.</li></ul>"}, {"ref": "02PR03", "t": "PR", "n": "03", "title": "Arrêt cardiaque", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Signes</strong> : ne répond pas, ne réagit pas, et ne respire pas <strong>ou</strong> respiration anormale (agonique, lente, bruyante, inefficace).</li><li><strong>Causes</strong> : adulte → maladie du cœur (infarctus), fibrillation ventriculaire ; enfant → origine respiratoire ; aussi hémorragie, brûlure grave, OVA, intoxication, traumatisme, noyade.</li><li><strong>Risques</strong> : mort en quelques minutes ; lésions cérébrales dès la 1re minute.</li><li><strong>Chaîne de survie</strong> : <strong>ALERTER</strong> → <strong>MASSER</strong> (RCP précoce) → <strong>DÉFIBRILLER</strong>. Survie de 4 à 40 % ; chaque minute gagnée = +10 % de chances. Applis citoyennes : Staying Alive, SAUV Life, Permis de sauver.</li></ul><h3>CAT</h3><ul><li>Courte période de mouvements saccadés possible à l’arrêt cardiaque : examiner dès qu’ils cessent.</li><li><mark>Rechercher une perte de connaissance : questions simples (« Vous m’entendez ? »), secouer doucement les épaules ou « Serrez-moi la main »</mark></li><li>Elle répond ou réagit : CAT adaptée au malaise.</li><li>Elle ne répond pas : demander de l’aide si seul ; allonger sur le dos ; libérer les voies aériennes ; <mark>rechercher</mark> la respiration 10 s maximum (regarder, écouter, sentir).</li><li><mark>si la victime respire, appliquer la conduite à tenir face à une perte de connaissance</mark></li><li><mark>si la victime ne respire pas ou si la respiration est anormale :</mark><ul><li><mark>si aucun tiers : alerter (portable en haut-parleur, débuter la RCP en même temps ; sans téléphone ni réseau, aller alerter puis revenir) ; si un DAE est proche, le mettre en œuvre au plus tôt et suivre ses indications vocales, en interrompant le massage le moins possible</mark></li><li><mark>si un tiers est présent : lui demander d’alerter, et de ramener et installer un DAE</mark></li><li><mark>débuter immédiatement une RCP, cycles de : adulte 30 compressions / 2 insufflations ; enfant et nourrisson 15 / 2</mark></li><li><mark>si un DAE est installé : reprendre la RCP immédiatement après la délivrance, ou non, d’un choc, sans attendre ses instructions vocales</mark></li><li><mark>poursuivre jusqu’à une demande d’interruption par le DAE ou le relais par les secours</mark></li></ul></li></ul><p class=\"note\"><mark>DAE « proche » : récupéré soi-même s’il est facilement accessible, sans quitter la victime plus de 10 s ; sinon RCP jusqu’à ce qu’on l’apporte. Les secours appelés peuvent guider la RCP par téléphone.</mark></p><p class=\"note\">Insufflations impossibles (maladie infectieuse, vomissements, traumatisme de la face, répulsion) : compressions seules en continu, 100 à 120 par minute.</p><ul><li>Plusieurs intervenants : relais toutes les 2 min environ (pendant l’analyse du DAE) ; un « coach » peut guider, encourager, corriger.</li></ul><h3>En période d’épidémie</h3><ul><li>Se protéger avec un masque si possible ; <mark>rechercher</mark> la respiration en regardant ventre et poitrine (sans bascule de tête, sans se pencher sur le visage).</li><li><mark>si possible, placer un tissu, une serviette ou un masque sur la bouche et le nez de la victime ; effectuer seulement des compressions thoraciques</mark></li><li>Bouche-à-bouche laissé à l’appréciation : secouriste sous le même toit que la victime ; victime enfant ou nourrisson. Se tenir au pied de la victime lors du choc ; se laver les mains.</li></ul>"}, {"ref": "02FT06", "t": "FT", "n": "06", "title": "Libération des voies aériennes", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Indication</strong> : systématique avant de <mark>rechercher</mark> la respiration chez une victime qui ne répond ni ne réagit.</li><li><strong>Justification</strong> : la bascule de tête (adulte, enfant) ou position neutre (nourrisson) + élévation du menton entraînent la langue et améliorent le passage de l’air.</li><li><strong>Réalisation</strong> : paume d’une main sur le front ; 2 ou 3 doigts de l’autre main sous la pointe du menton, en appui sur l’os.</li><li><strong>Adulte / enfant</strong> : basculer doucement la tête en arrière en appuyant sur le front, tout en élevant le menton.</li><li><strong>Nourrisson</strong> : tête en position neutre dans l’alignement du torse ; élever le menton, sans bascule excessive.</li><li><strong>Points clés</strong> : <mark>la position du secouriste doit être stable</mark> ; menton élevé, tête maintenue.</li></ul>"}, {"ref": "02FT07", "t": "FT", "n": "07", "title": "Compressions thoraciques", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><mark>indication : chaque fois qu’une victime présente un arrêt cardiaque ou a perdu connaissance à la suite d’une obstruction des voies aériennes</mark></li><li>Victime sur le dos, à l’horizontale, de préférence sur un plan dur. <mark>L’installation sur un plan dur ne doit pas retarder la RCP.</mark></li><li>À genoux au plus près ; dénuder la poitrine ; appuyer verticalement, sans appuyer sur les côtes ; 100 à 120 par minute ; temps de compression = temps de relâchement ; laisser le thorax reprendre sa forme sans décoller le talon de la main (adulte, enfant) ou <mark>les pouces</mark> (nourrisson, nouveau-né).</li><li>Relais toutes les 2 min en interrompant le moins possible (avec DAE : relais pendant l’analyse).</li></ul><h3>Adulte</h3><ul><li>Talon d’une main au centre de la poitrine, moitié inférieure du sternum ; autre main dessus, doigts entrecroisés et relevés ; bras tendus, coudes verrouillés ; profondeur d’environ 5 cm sans dépasser 6 cm.</li></ul><h3>Enfant</h3><ul><li><mark>talon d’une main au centre de la poitrine, sur la moitié inférieure du sternum</mark></li><li>Doigts relevés ; bras tendus, coude verrouillé ; profondeur d’un tiers de l’épaisseur, soit environ 5 cm ; changer de main toutes les 2 min ; enfant grand ou secouriste petit : technique adulte.</li></ul><h3>Nourrisson</h3><ul><li><mark>entourer le thorax du nourrisson avec les mains</mark></li><li><mark>placer la pulpe des deux pouces placés l’un sur l’autre, au centre de la poitrine, sur la moitié inférieure du sternum</mark></li><li>Profondeur d’un tiers de l’épaisseur, soit environ 4 cm.</li><li><strong>Points clés</strong> : comprimer fortement le sternum ; 100 à 120 par minute.</li></ul>"}, {"ref": "02FT08", "t": "FT", "n": "08", "title": "Insufflations", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Indication</strong> : arrêt cardiaque (apporter de l’air aux poumons).</li><li><mark>libérer les voies aériennes et maintenir cette position durant les insufflations</mark></li><li><strong>Adulte / enfant</strong> : pincer le nez <mark>de la main tenant le front</mark> ; ouvrir légèrement la bouche, menton élevé ; inspirer sans excès ; bouche largement ouverte autour de celle de la victime, appui ferme. <strong>Nourrisson</strong> : englober bouche et nez.</li><li><mark>insuffler progressivement jusqu’à ce que la poitrine de la victime commence à se soulever (≈ 1 s)</mark></li><li><mark>se redresser légèrement tout en maintenant la bascule de la tête en arrière afin de : reprendre son souffle ; vérifier l’affaissement de la poitrine</mark></li><li><mark>insuffler une seconde fois dans les mêmes conditions</mark></li><li><mark>si le ventre ou la poitrine ne se soulève pas : tête bien positionnée et menton élevé ; bonne étanchéité, pas de fuite d’air ; rechercher un corps étranger dans la bouche et le retirer avec les doigts si nécessaire</mark></li><li><strong>Points clés</strong> : insufflations lentes et progressives ; cesser dès le début du soulèvement de la poitrine ; 5 s maximum pour les deux.</li></ul>"}, {"ref": "02FT09", "t": "FT", "n": "09", "title": "Défibrillation", "d": "12-2023", "nw": 0, "hl": false, "html": "<ul><li>Suivre toutes les indications du DAE. Si plusieurs secouristes : poursuivre la RCP pendant l’installation ; n’interrompre les compressions que lorsque le DAE le demande.</li></ul><h3>Adulte</h3><ul><li>Mettre en fonction ; dénuder la poitrine (couper les vêtements) ; sécher le thorax ; électrodes sur poitrine nue selon le schéma (généralement : sous la clavicule droite contre le bord droit du sternum ; côté gauche, 5 à 10 cm sous l’aisselle) ; connecter si nécessaire.</li><li>Analyse : ne plus toucher la victime et s’assurer que personne ne la touche.</li><li><strong>Choc nécessaire</strong> : faire écarter tout le monde ; choc automatique (DEA) ou appui sur « choc » (DSA) ; reprendre <strong>immédiatement</strong> les compressions. <strong>Pas de choc</strong> : reprendre immédiatement les compressions. RCP ≈ 2 min avant la nouvelle analyse.</li></ul><h3>Enfant / nourrisson</h3><ul><li>Appareil adapté (électrodes enfant, réducteur d’énergie). À défaut, électrodes adultes : une au milieu du thorax, une au milieu du dos.</li></ul><h3>Contraintes</h3><ul><li>Forte poitrine : électrode gauche sous le sein · Poitrine très velue : raser · Timbre médicamenteux : retirer et essuyer · Stimulateur cardiaque : électrode à une largeur de main (≈ 8 cm) · Sol ou thorax mouillé : déplacer / sécher · Surface métallique : déplacer ou glisser un tissu.</li><li>Mouvement détecté : ne pas toucher, vérifier la respiration. DAE redemande les électrodes : vérifier collage et câble, sinon 2e paire.</li><li><strong>Points clés</strong> : la plus précoce possible ; interrompre le moins possible les compressions.</li></ul>"}, {"ref": "02AC01", "t": "AC", "n": "01", "title": "Défibrillateur automatisé externe (DAE)", "d": "12-2022", "nw": 0, "hl": true, "html": "<ul><li>Analyse l’activité électrique du cœur, reconnaît l’anomalie à l’origine de l’arrêt, délivre (ou invite à délivrer) un choc.</li><li><strong>Composition</strong> : haut-parleur ; métronome (option) ; accumulateur ; bouton choc éventuel ; électrodes autocollantes à usage unique (2e paire disponible) ; accessoires : ciseaux, compresses, rasoir jetable.</li><li><strong>Localisation</strong> : ERP, aéroports, avions, grands magasins, gares, trains, lieux de travail, immeubles ; armoires murales avec logo identifiable.</li><li>Applications permettant de localiser un défibrillateur <mark>existant</mark> : <mark>Staying Alive, etc.</mark> À avoir en permanence sur son téléphone.</li></ul>"}, {"ref": "02PR04", "t": "PR", "n": "04", "title": "Perte de connaissance", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Définition</strong> : ne répond et ne réagit à aucune sollicitation verbale ou physique, mais respire. <strong>Risque</strong> : arrêt respiratoire puis cardiaque (liquides dans la gorge ; chute de la langue). <strong>Principe</strong> : assurer la liberté des voies aériennes.</li></ul><p class=\"note\"><mark>Liquides : réflexes de déglutition diminués. Langue : tonus musculaire très diminué ; l’obstruction peut empêcher toute respiration naturelle ou artificielle.</mark></p><h3>CAT</h3><ul><li><mark>Rechercher</mark> une perte de connaissance ; demander de l’aide si seul ; allonger sur le dos ; libérer les voies aériennes ; <mark>rechercher</mark> la respiration 10 s maximum.</li><li><mark>si la victime ne répond pas et ne réagit pas et respire, appliquer la conduite à tenir suivante :</mark></li><li><strong>Événement non traumatique</strong> : PLS ; faire alerter ou alerter ; surveiller en permanence la respiration (regarder, écouter, sentir avec le plat de la main).</li><li><strong>Traumatisme ou origine inconnue</strong> : laisser sur le dos ; alerter et respecter les consignes <mark>(les secours peuvent demander la PLS)</mark> ; surveiller en permanence la respiration <mark>comme lors de la recherche</mark> <mark>(le maintien de la LVA stabilise le rachis cervical)</mark> ; si vomit ou régurgite : sur le côté en maintenant l’axe tête-cou-tronc, demander de l’aide.</li><li><strong>Dans tous les cas</strong> : protéger contre chaleur, froid, intempéries ; respiration arrêtée ou anormale → CAT arrêt cardiaque et prévenir les secours.</li></ul><p class=\"note\">PLS : femme enceinte ou victime obèse → côté gauche (évite la compression de vaisseaux abdominaux).</p><h3>En période d’épidémie</h3><ul><li>Masque si possible ; questionner sans toucher ; respiration en regardant ventre et poitrine (sans bascule de tête ni se pencher). Si elle respire : la laisser dans la position, alerter, surveiller ; se laver les mains.</li></ul>"}, {"ref": "02FT10", "t": "FT", "n": "10", "title": "Position latérale de sécurité (PLS)", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Indication</strong> : ne répond pas, ne réagit pas, respire, après un événement non traumatique ou à la demande des secours.</li><li><strong>Justification</strong> : <mark>la PLS maintient libres les voies aériennes supérieures en permettant l’écoulement des liquides vers l’extérieur et évite que la langue ne chute dans le fond de la gorge.</mark></li></ul><h3>1er temps : préparer le retournement</h3><ul><li>Retirer les lunettes ; rapprocher les membres inférieurs de l’axe du corps ; bras côté secouriste à angle droit, coude plié, paume vers le haut <mark>(bras au sens du langage courant et non anatomique)</mark> ; se placer à genoux ou en trépied au niveau du thorax ; saisir le bras opposé, amener le dos de la main contre l’oreille côté secouriste et l’y maintenir (paume contre paume) ; attraper la jambe opposée derrière le genou, la relever en gardant le pied au sol ; s’éloigner du thorax.</li></ul><h3>2e temps : retourner</h3><ul><li>Tirer sur la jambe jusqu’à ce que le genou touche le sol, sans brusquerie, en un seul temps ; dégager doucement la main sous la tête en préservant la bascule de la tête, en maintenant le coude.</li></ul><h3>3e temps : stabiliser</h3><ul><li>Ajuster la jambe du dessus (bassin tenu, hanche et genou à angle droit) ; ouvrir la bouche sans mobiliser la tête ni rabattre le menton sur le sternum.</li><li><strong>Nourrisson</strong> : sur le côté, dans les bras du secouriste, dos contre lui.</li><li><strong>Points clés</strong> : limiter les mouvements du rachis ; position stable, la plus latérale possible ; contrôle permanent de la respiration ; bouche ouverte pour l’écoulement des liquides.</li></ul>"}, {"ref": "02PR05", "t": "PR", "n": "05", "title": "Malaises", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Définition</strong> : sensation pénible traduisant un trouble du fonctionnement de l’organisme, sans origine obligatoirement identifiable.</li><li><mark>la victime, consciente, ne se sent pas bien et présente des signes inhabituels. Les signes qui doivent alerter le secouriste sont :</mark><ul><li><mark>douleur dans la poitrine · faiblesse ou paralysie d’un bras · déformation de la face</mark></li><li><mark>perte de la vision d’un œil ou des deux · difficulté de langage (incohérence de la parole) ou de compréhension</mark></li><li><mark>mal de tête sévère, inhabituel · perte d’équilibre, instabilité de la marche ou chute inexpliquée</mark></li><li><mark>fièvre (&gt; 37,8 °C), sensation de fièvre et frissons · sueurs abondantes · courbatures, fatigue intense</mark></li><li><mark>douleur abdominale intense et troubles digestifs (diarrhée) · difficulté à respirer ou à parler</mark></li><li><mark>sensation de froid, associée à des sueurs abondantes ou une pâleur intense</mark></li></ul></li><li><strong>Risques</strong> : certains signes, apparemment sans gravité, peuvent révéler une détresse vitale, <mark>exemples :</mark><ul><li><mark>un accident cardiaque · un accident vasculaire cérébral (AVC) · une maladie infectieuse qui peut être contagieuse · un malaise lié au diabète, à l’asthme, etc.</mark></li></ul></li></ul><h3>CAT en toute circonstance</h3><ul><li><mark>installer la victime en position d’attente, confortablement et sans délai : allongée ; assise en cas de difficultés à respirer ; sinon dans la position où elle se sent le mieux</mark></li><li><mark>observer les signes, d’apparition soudaine, isolés ou associés, même de très courte durée</mark></li><li><mark>se renseigner auprès de la victime ou de son entourage sur : son âge ; la durée du malaise ; des antécédents de malaises identiques et son état de santé actuel ; les traitements médicamenteux qu’elle prend</mark></li><li><mark>aider la victime, à sa demande ou à celle des secours, à prendre : son traitement prescrit ; du sucre en morceaux</mark></li><li><mark>en présence de signes qui doivent alerter, ou de doute, demander un avis médical : transmettre fidèlement les informations recueillies ; appliquer les consignes</mark></li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li><li>Signes de maladie infectieuse (surtout en épidémie) : mesures barrières, distance physique, isolement.</li></ul><h3>Cas particuliers</h3><ul><li><strong>Prévention des malaises vagaux</strong> :<ul><li><mark>appliquer la conduite à tenir face à toute victime d’un malaise</mark></li><li>inviter à réaliser des manœuvres physiques si malaises « vagaux » réguliers avec : étourdissement, nausées, sueurs, chaleur, points noirs devant les yeux, impression de perte de conscience imminente</li></ul></li><li><strong>Malaise provoqué par la chaleur</strong> (été, canicule, ambiance chaude, effort prolongé) : <mark>il faut :</mark><ul><li><mark>appliquer la conduite à tenir face à toute victime d’un malaise</mark></li><li>endroit frais et aéré ; mesurer la température si possible ; rafraîchir (déshabiller / desserrer, asperger d’eau froide ou linges humides, ventilateur, poches de glace sous aisselles, aine, cou) ; eau fraîche par petites quantités si consciente et capable d’avaler</li></ul></li></ul>"}, {"ref": "02FT11", "t": "FT", "n": "11", "title": "Manœuvres physiques", "d": "07-2023", "nw": 0, "hl": false, "html": "<ul><li><strong>Indication</strong> : dès que la victime reconnaît des signes annonciateurs d’une perte de connaissance imminente.</li><li><strong>But</strong> : agir sur la circulation pour éviter la perte de connaissance et les lésions d’une chute.</li><li>Réalisées <strong>par la victime elle-même</strong> (le secouriste explique si besoin). Elles ne remplacent pas la position allongée ; si on ne peut pas allonger (bus, avion, train), elles peuvent la précéder.</li></ul><h3>Les 3 manœuvres</h3><ul><li><strong>Accroupissement</strong> : position accroupie, tête baissée comme pour la mettre entre les genoux.</li><li><strong>Croisement des membres inférieurs</strong> (debout contre un mur ou allongée) : croiser les jambes, contracter les muscles en essayant de les tendre, serrer les fesses, contracter la ceinture abdominale.</li><li><strong>Crochetage des doigts et tension des bras</strong> : mains agrippées en crochet, coudes écartés de la poitrine au maximum, tirer comme pour séparer les mains.</li></ul><p class=\"note\">N. B. Le croisement des membres inférieurs est le plus efficace des trois.</p><ul><li><strong>Points clés</strong> : réalisées dès les premiers signes de malaise, et poursuivies après la mise en position allongée.</li></ul>"}, {"ref": "02PR06", "t": "PR", "n": "06", "title": "Plaies", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Plaie simple</strong> : petite coupure superficielle, éraflure saignant peu.</li><li><strong>Plaie grave</strong> : hémorragie associée ; mécanisme <mark>pénétrant</mark> (objet tranchant ou perforant, morsure, projectile, <mark>injection de liquide sous pression</mark>) ; localisation thoracique, abdominale, oculaire ou près d’un orifice naturel ; aspect déchiqueté, écrasé ; <mark>multiplicité des plaies</mark>.</li><li><strong>Risques</strong> : hémorragie, détresse respiratoire, infection dont le tétanos (seule la vaccination protège).</li></ul><h3>Plaie grave</h3><ul><li>Ne jamais retirer le corps étranger pénétrant ; en cas d’hémorragie, <mark>appliquer la conduite à tenir adaptée</mark>.</li><li><mark>installer la victime en position d’attente, confortablement et sans délai :</mark><ul><li>thorax : assise, plaie à l’air libre · abdomen : allongée, jambes fléchies · œil : allongée, yeux fermés, ne pas bouger la tête (la maintenir à deux mains) · autres cas : allongée</li></ul></li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>faire alerter ou alerter les secours et appliquer les consignes</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li></ul><h3>Plaie simple</h3><ul><li><mark>se laver les mains avec de l’eau et du savon ou utiliser une solution hydroalcoolique</mark></li><li><mark>nettoyer la plaie : eau courante propre ou en bouteille, à défaut sérum physiologique ; savon si souillée ; compresse pour enlever les souillures</mark></li><li><mark>sécher autour de la plaie et la protéger par un pansement</mark></li><li><mark>conseiller de consulter un médecin : si vaccination antitétanique non à jour ; si signes d’infection dans les jours qui suivent</mark></li></ul><p class=\"note\"><mark>Infection : fièvre, suintements, zone chaude, rouge, gonflée ou douloureuse, notamment dans les 24 h.</mark></p><h3>Amputation ou arrachement</h3><ul><li><mark>arrêter l’hémorragie immédiatement ; pansement compressif sur la plaie, même en l’absence de saignement</mark></li><li><mark>conditionner la partie amputée, au frais, sans la congeler : la récupérer ; l’envelopper dans un tissu propre humidifié d’eau ; la placer dans un contenant propre et étanche ; placer ce contenant dans un autre avec de la glace ou de l’eau glacée ; indiquer nom de la personne et heure</mark></li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>faire alerter ou alerter les secours et appliquer les consignes</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li><li><mark>remettre la partie du corps conditionnée aux secours</mark></li></ul>"}, {"ref": "02PR07", "t": "PR", "n": "07", "title": "Brûlures", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Brûlure simple</strong> : rougeurs chez l’adulte, ou une cloque de surface &lt; moitié de la paume de la victime.</li><li><strong>Brûlure grave</strong> : cloques &gt; ½ paume ; destruction profonde (blanchâtre ou noirâtre, parfois indolore) ; <mark>aspect circulaire (qui fait le tour du cou ou d’un membre)</mark> ; visage ou cou, mains, articulations, orifices naturels ; rougeur étendue chez l’enfant ; origine chimique, électrique ou radiologique.</li><li><strong>Risques</strong> : défaillance circulatoire ou respiratoire, douleur sévère, infection, séquelles. <mark>La brûlure est évolutive, sans action immédiate, elle peut continuer de s’étendre en profondeur et en surface.</mark></li></ul><h3>Brûlure thermique</h3><ul><li><strong>Refroidir immédiatement</strong> (eau courante tempérée, faible pression, ≥ 10 min, idéalement 20 min ; inutile après 30 min) en retirant vêtements et bijoux non adhérents.</li><li><strong>Grave</strong> :<ul><li><mark>dès le début de l’arrosage, faire alerter ou alerter les secours et appliquer les consignes</mark></li><li>poursuivre le refroidissement selon les consignes ; position d’attente : assise si gêne respiratoire ; laisser la partie brûlée visible</li><li><mark>allongée confortablement</mark></li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li><li>Aucun produit sur une brûlure grave sans avis médical.</li></ul></li><li><strong>Simple</strong> : refroidir jusqu’à disparition de la douleur ; ne jamais percer les cloques ;<ul><li>pansement stérile ou film plastique non adhésif <mark>(film alimentaire : maintient l’humidité, épouse la zone)</mark></li><li><mark>conseiller de consulter un médecin : si vaccination antitétanique non à jour ; si signes d’infection dans les jours qui suivent</mark></li><li>Aussi s’il s’agit d’un enfant ou d’un nourrisson.</li></ul></li></ul><h3>Brûlure électrique</h3><ul><li><mark>appliquer la conduite à tenir face à une brûlure thermique grave, en adaptant comme suit :</mark><ul><li>ne jamais toucher la victime avant la suppression du risque électrique ; arroser <mark>les</mark> zones visiblement brûlées à l’eau courante tempérée</li></ul></li></ul><h3>Brûlure chimique ou par inhalation</h3><ul><li>Se protéger : éviter tout contact <mark>avec l’origine de la brûlure</mark> ; la victime se rince immédiatement et abondamment à l’eau courante tempérée :<ul><li>peau / vêtements : <mark>rincer</mark> tout le corps et <mark>ôter sous l’eau</mark> les vêtements imbibés · œil : <mark>rincer</mark> et faire retirer les lentilles</li></ul></li><li><mark>En cas d’ingestion :</mark> ne jamais faire vomir ni boire ; conserver les informations du produit. Inhalation : si difficultés respiratoires, position assise.</li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>faire alerter ou alerter les secours et appliquer les consignes</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li><li>Se laver les mains après les gestes de secours.</li></ul>"}, {"ref": "02PR08", "t": "PR", "n": "08", "title": "Traumatismes", "d": "07-2026", "nw": 0, "hl": true, "html": "<ul><li><strong>Lésions</strong> : os (fractures), articulations (entorses, luxations), organes, peau (cf. brûlures et plaies). Signes : douleur vive, difficulté ou impossibilité de bouger, gonflement, déformation.</li><li>Choc à la tête, au thorax ou à l’abdomen : atteinte d’organes possible, signes secondaires (perte de connaissance, maux de tête persistants, vomissements, agitation, somnolence, douleur abdominale). Douleur du dos ou de la nuque : atteinte de la moelle possible.</li><li><strong>Principe</strong> : ne pas mobiliser la victime.</li></ul><h3>CAT</h3><ul><li>Perte de connaissance : CAT d’origine traumatique. Sinon :</li><li><mark>conseiller fermement de ne pas mobiliser la partie atteinte (douleur au cou : ne pas bouger la tête)</mark></li><li><mark>si fracture de membre déplacée, ne pas tenter de le réaligner</mark></li><li><mark>protéger la victime de la chaleur, du froid ou des intempéries</mark></li><li><mark>faire alerter ou alerter les secours et appliquer les consignes</mark></li><li><mark>surveiller en permanence la victime et lui parler régulièrement</mark></li><li><mark>en cas d’aggravation, alerter de nouveau les secours et pratiquer les gestes qui s’imposent</mark></li></ul>"}],K='psc02',$=id=>document.getElementById(id);
let sel=new Set(JSON.parse(localStorage.getItem(K)||'[]')),only=false;
if(F.length<=2&&!localStorage.getItem(K))F.forEach(f=>sel.add(f.ref));
F.forEach(f=>{const d=document.createElement('div');d.innerHTML=f.html;f.txt=(f.title+' '+d.textContent).toLowerCase()});
const save=()=>{try{localStorage.setItem(K,JSON.stringify([...sel]))}catch(e){}};
function hl(root,q){const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),w=document.createTreeWalker(root,4),ns=[];
while(w.nextNode())ns.push(w.currentNode);
ns.forEach(n=>{if(!re.test(n.nodeValue))return;re.lastIndex=0;const s=document.createElement('span');
s.innerHTML=n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(re,m=>'<mark class="hit">'+m+'</mark>');n.replaceWith(s)})}
function chips(){const c=$('chips');c.innerHTML='';F.forEach(f=>{const e=document.createElement('div');
e.className='chip '+f.t+(sel.has(f.ref)?' on':'');e.innerHTML='<i>'+f.n+'</i>'+f.title;
e.onclick=()=>{sel.has(f.ref)?sel.delete(f.ref):sel.add(f.ref);save();chips();draw()};c.appendChild(e)})}
function open_(f){sel.add(f.ref);save();chips();draw();setTimeout(()=>{const e=$(f.ref);e&&e.scrollIntoView({behavior:'smooth'})},30)}
function draw(){const q=$('q').value.trim().toLowerCase(),m=$('m');m.innerHTML='';document.body.classList.toggle('hl',only);
const L=F.filter(f=>sel.has(f.ref)&&(!q||f.txt.includes(q))&&(!only||f.hl));
if(!L.length){const d=document.createElement('div');d.className='em';
d.textContent=sel.size?'Aucun résultat dans les fiches affichées.':'Touchez une fiche ci-dessus ou ci-dessous.';m.appendChild(d);
if(!sel.size){const h=document.createElement('div');h.className='home';
F.filter(f=>!only||f.hl).forEach(f=>{const b=document.createElement('button');b.className='hi '+f.t;
b.innerHTML='<i>'+f.n+'</i><span>'+f.title+'</span>'+(f.hl?'<em>★</em>':'');b.onclick=()=>open_(f);h.appendChild(b)});m.appendChild(h)}return}
L.forEach(f=>{const c=document.createElement('div');c.className='card '+f.t+(f.nw?' full':'');c.id=f.ref;
c.innerHTML='<div class="sp">'+f.t+'<b>'+f.n.replace(/^[A-Z]+/,'')+'</b></div><div class="cb"><div class="ref">'+f.ref+' · '+f.d+(f.nw?'<span class="nw">NOUVEAU / ENTIÈREMENT MODIFIÉ</span>':'')+'</div><h2>'+f.title+'</h2>'+f.html+'</div>';
m.appendChild(c);if(q)hl(c,q);
c.querySelectorAll('input').forEach((i,k)=>{const key=K+f.ref+k;try{i.checked=localStorage.getItem(key)=='1'}catch(e){}
i.onchange=()=>{try{localStorage.setItem(key,i.checked?'1':'0')}catch(e){}}})})}
$('q').oninput=draw;
$('all').onclick=()=>{F.forEach(f=>sel.add(f.ref));save();chips();draw()};
$('none').onclick=()=>{sel.clear();save();chips();draw()};
$('star').onclick=()=>{only=!only;$('star').classList.toggle('on',only);draw()};
chips();draw();
</script></body></html>
